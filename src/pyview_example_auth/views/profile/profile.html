<div class="flex items-center justify-center h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-sm w-full">
        <div class="flex flex-col items-center">
            {% if user.picture %}
            <img src="{{user.picture}}" alt="Avatar" class="rounded-full mb-4 w-24 h-24">
            {% else %}
            <div class="rounded-full mb-4 w-24 h-24 bg-purple-600 flex items-center justify-center">
                <span class="text-3xl text-white font-bold">
                    {{ user.name[0] | upper if user.name else '?' }}
                </span>
            </div>
            {% endif %}
            <h2 class="text-2xl font-bold mb-2">{{user.name}}</h2>
            <p class="text-gray-600 mb-2">{{user.email}}</p>
            {% if user.auth_method %}
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
                {% if user.auth_method == 'passkey' %}bg-purple-100 text-purple-800{% else %}bg-blue-100 text-blue-800{% endif %} mb-4">
                {% if user.auth_method == 'passkey' %}
                <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 2 2 0 012 2 1 1 0 102 0 4 4 0 00-4-4z" clip-rule="evenodd"/>
                </svg>
                Passkey
                {% else %}
                <svg class="w-3 h-3 mr-1" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google
                {% endif %}
            </span>
            {% endif %}
            <a href="/auth/logout" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Logout
            </a>
        </div>
    </div>
</div>
